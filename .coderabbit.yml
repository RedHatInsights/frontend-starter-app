# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration.
#
# AGENTS.md (auto-detected) covers rules for agents WRITING code.
# This file covers rules for CodeRabbit REVIEWING code.
# They are complementary: AGENTS.md = coding standards, this file = PR hygiene checks.

language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  collapse_walkthrough: false
  poem: false

  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!coverage/**"
    - "!*.lock"
    - "!package-lock.json"
    - "!static/mockServiceWorker.js"
    - "!build-tools/**"

  path_instructions:
    - path: "**"
      instructions: |
        ## PR hygiene checks

        ### Testing strategy
        This repo uses **Storybook as the primary UI testing tool**. Jest is for pure
        utility functions only (no React rendering). Playwright is for e2e smoke tests
        against staging.

        Do NOT request Jest unit tests for React components — request Storybook stories
        with play functions instead. Do NOT request Cypress tests — Cypress has been removed.

        ### Routes
        If the PR adds or modifies a route (check `src/Routing.tsx`):
        - There must be a Storybook user-journey story covering the happy path.
        - Flag the absence as a blocking issue.

        ### Components
        If the PR adds a new component in `src/features/` or `src/shared/components/`:
        - There must be a `.stories.tsx` file alongside it.
        - The story should have at least one `play` function testing an interaction.
        - Flag missing stories as a blocking issue.

        ### TableView usage
        If the PR introduces a `TableView` import without a corresponding `useTableState`,
        flag it as a blocking issue.

        ### Feature island READMEs
        If the PR modifies files inside `src/features/<island>/` and introduces a new
        sub-feature, changes the data layer, or adds a notable constraint — the island's
        `README.md` should be updated. Flag missing README updates as a warning.

        ### Data layer DI
        If the PR adds imports of `useChrome`, `useAddNotification`, or `useFlag` in any
        file under `src/**/data/queries/`, flag it as a blocking issue. Data hooks must
        use `useAppServices()` only. See `src/features/roles/data/queries/README.md`.

    - path: "src/features/**/*.tsx"
      instructions: |
        Export rule: components must use named exports. Features (route/page containers)
        may additionally export a default, but must always have a named export too.
        Flag `export default` as the only export as a blocking issue.

    - path: "src/shared/components/**"
      instructions: |
        Changes here are shared infrastructure used by all features.
        Before approving: identify all consumers of the changed file and verify no
        feature's Storybook stories are broken.

    - path: "src/docs/**"
      instructions: |
        Docs must not duplicate TypeScript type definitions from source — they reference
        source file paths instead. Flag code blocks that contain `interface Foo { ... }`
        or `type Foo = ...` declarations that will drift from source.
        Do NOT flag: usage snippets, option tables, or inline shape descriptions.

    - path: "src/**/data/mocks/**"
      instructions: |
        MSW handler factories and mock databases are test infrastructure.
        Do NOT flag: missing request body validation, missing explicit return types,
        or missing error handling. These serve known shapes to Storybook stories —
        they are not production code.

    - path: "src/**/data/queries/**"
      instructions: |
        Data query hooks must get ALL dependencies from `useAppServices()`.
        Flag any direct import of platform hooks (`useChrome`, `useAddNotification`,
        `useFlag`) as a blocking issue.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "master"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  tools:
    eslint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 300000

chat:
  art: false
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "src/docs/**/*.mdx"

tone_instructions: |
  Template repository for HCC frontend teams. Be concise and constructive.
  This repo uses Storybook for UI testing (not Jest). Mock handlers are test code.
  Focus on patterns that will be copied by teams bootstrapping new apps.
